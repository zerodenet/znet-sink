[package]
name = "znet-engine-client"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
publish = false
description = "Transport-independent Zero observation client and subscription ownership"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
