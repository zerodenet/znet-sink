[package]
name = "tauri-plugin-znet-native-io"
version = "0.0.3"
edition = "2021"
license = "MPL-2.0"
license-file = "../../../LICENSE"
links = "znet-native-io"

[dependencies]
tauri = { version = "2", default-features = false }
serde = { version = "1", features = ["derive"] }
base64 = "0.22"
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dev-dependencies]
serde_json = "1"
