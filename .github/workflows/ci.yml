name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop

concurrency:
  group: znet-sink-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend DNS and capability contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run DNS configuration regression
        run: pnpm test:dns-config

      - name: Run portable kernel settings contract
        run: pnpm test:kernel-settings

      - name: Check shared UI control contract
        run: pnpm test:ui-controls

      - name: Check TUN lifecycle and mode contract
        run: pnpm test:cross-mode-state

      - name: Check Svelte and TypeScript
        run: pnpm check

      - name: Build frontend
        run: pnpm build

  ui-controls:
    name: UI controls (Chromium and WebKit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm test:ui-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-control-browser-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  windows-client-core:
    name: Windows DNS and client core
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Windows DNS capability and mode matrix
        run: pnpm test:dns-config

      - name: Run Windows portable kernel settings contract
        run: pnpm test:kernel-settings

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Run client core tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked -j 1

  windows-zero-dns-contract:
    name: Windows Zero DNS contract
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Check out current Zero develop
        uses: actions/checkout@v4
        with:
          repository: zerodenet/core
          ref: develop
          path: zero-core

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install client dependencies
        run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: zero-core
          cache-on-failure: true

      - name: Install protoc for Zero
        uses: ./zero-core/.github/actions/setup-protoc
        with:
          version: "35.0"

      - name: Generate client-owned DNS contract fixtures
        shell: pwsh
        run: |
          $contractDir = Join-Path $env:RUNNER_TEMP "znet-zero-dns-contract"
          node --experimental-strip-types --loader ./scripts/lib-alias-loader.mjs ./scripts/generate-dns-contract-fixtures.mjs $contractDir
          "DNS_CONTRACT_DIR=$contractDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ZERO_CONTRACT_SHA=$(git -C zero-core rev-parse HEAD)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build current Zero
        run: cargo build --manifest-path zero-core/Cargo.toml --release -j 2

      - name: Validate every client DNS mode against Zero
        shell: pwsh
        run: |
          $zero = Join-Path $PWD "zero-core/target/release/zero.exe"
          $manifest = Get-Content (Join-Path $env:DNS_CONTRACT_DIR "manifest.json") -Raw | ConvertFrom-Json
          foreach ($file in $manifest.valid) {
            $path = Join-Path $env:DNS_CONTRACT_DIR $file
            & $zero validate $path
            if ($LASTEXITCODE -ne 0) {
              throw "Zero $env:ZERO_CONTRACT_SHA rejected valid client fixture $file"
            }
          }
          foreach ($file in $manifest.invalid) {
            $path = Join-Path $env:DNS_CONTRACT_DIR $file
            $validation = Start-Process -FilePath $zero -ArgumentList @(
              "validate", $path
            ) -Wait -PassThru -NoNewWindow
            if ($validation.ExitCode -eq 0) {
              throw "Zero $env:ZERO_CONTRACT_SHA accepted invalid client fixture $file"
            }
          }

      - name: Hot-apply, persist, and restart DNS configurations
        shell: pwsh
        run: |
          $zero = Join-Path $PWD "zero-core/target/release/zero.exe"
          $pipe = "\\.\pipe\znet-zero-dns-contract-$PID"
          $runtimeDir = Join-Path $env:RUNNER_TEMP "znet-zero-dns-runtime"
          New-Item -ItemType Directory -Path $runtimeDir -Force | Out-Null

          $portProbe = [System.Net.Sockets.TcpListener]::new(
            [System.Net.IPAddress]::Loopback,
            0
          )
          $portProbe.Start()
          $listenPort = ([System.Net.IPEndPoint]$portProbe.LocalEndpoint).Port
          $portProbe.Stop()

          $fixtureNames = @(
            "disabled-no-tun.json",
            "real-system-no-tun.json",
            "real-doh-no-tun.json",
            "real-doq-no-tun.json",
            "fake-ip-no-tun.json"
          )
          foreach ($file in $fixtureNames) {
            $config = Get-Content (Join-Path $env:DNS_CONTRACT_DIR $file) -Raw | ConvertFrom-Json
            $config.inbounds = @(
              [pscustomobject]@{
                tag = "contract-loopback"
                listen = [pscustomobject]@{
                  address = "127.0.0.1"
                  port = $listenPort
                }
                protocol = [pscustomobject]@{ type = "mixed" }
              }
            )
            $config | ConvertTo-Json -Depth 100 | Set-Content (
              Join-Path $runtimeDir $file
            ) -Encoding utf8
          }

          $initial = Join-Path $runtimeDir "disabled-no-tun.json"
          $sequence = @(
            "real-system-no-tun.json",
            "real-doh-no-tun.json",
            "real-doq-no-tun.json",
            "fake-ip-no-tun.json"
          )

          function Wait-ZeroReady([string]$executable, [string]$socket) {
            for ($attempt = 0; $attempt -lt 60; $attempt++) {
              & $executable status --json --socket $socket 2>$null | Out-Null
              if ($LASTEXITCODE -eq 0) {
                return
              }
              Start-Sleep -Seconds 1
            }
            throw "Zero did not become ready on $socket"
          }

          function Stop-Zero([System.Diagnostics.Process]$process) {
            if ($null -ne $process -and -not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
              $process.WaitForExit()
            }
          }

          $process = $null
          try {
            $process = Start-Process -FilePath $zero -ArgumentList @(
              "run", "--control-socket", $pipe, $initial
            ) -PassThru -WindowStyle Hidden
            Wait-ZeroReady $zero $pipe
            foreach ($file in $sequence) {
              $candidate = Join-Path $runtimeDir $file
              & $zero reload $candidate --socket $pipe
              if ($LASTEXITCODE -ne 0) {
                throw "Zero $env:ZERO_CONTRACT_SHA rejected hot apply for $file"
              }
            }
          } finally {
            Stop-Zero $process
          }

          function Assert-JsonContains($actual, $expected, [string]$path) {
            if ($expected -is [pscustomobject]) {
              foreach ($property in $expected.PSObject.Properties) {
                $actualProperty = $actual.PSObject.Properties[$property.Name]
                if ($null -eq $actualProperty) {
                  throw "Persisted configuration lost $path.$($property.Name)"
                }
                Assert-JsonContains $actualProperty.Value $property.Value "$path.$($property.Name)"
              }
              return
            }
            if ($expected -is [System.Collections.IList] -and $expected -isnot [string]) {
              if ($actual.Count -ne $expected.Count) {
                throw "Persisted configuration changed $path array length or rule order"
              }
              for ($index = 0; $index -lt $expected.Count; $index++) {
                Assert-JsonContains $actual[$index] $expected[$index] "$path[$index]"
              }
              return
            }
            if ($actual -ne $expected) {
              throw "Persisted configuration changed $path"
            }
          }

          $expectedPath = Join-Path $runtimeDir $sequence[-1]
          $persistedConfig = Get-Content $initial -Raw | ConvertFrom-Json
          $expectedConfig = Get-Content $expectedPath -Raw | ConvertFrom-Json
          Assert-JsonContains $persistedConfig.runtime.dns $expectedConfig.runtime.dns "runtime.dns"

          try {
            $process = Start-Process -FilePath $zero -ArgumentList @(
              "run", "--control-socket", $pipe, $initial
            ) -PassThru -WindowStyle Hidden
            Wait-ZeroReady $zero $pipe
          } finally {
            Stop-Zero $process
          }

