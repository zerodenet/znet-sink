name: Retry subscription dialog follow-up

on:
  push:
    branches:
      - agent/fix-subscription-format-detection

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-subscription-format-detection
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply follow-up fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/patch-subscription-dialog-followup.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY", start)
          script = textwrap.dedent(source[start:end])
          Path('/tmp/subscription-followup.py').write_text(script, encoding='utf-8')
          PY
          python /tmp/subscription-followup.py
          rustfmt --edition 2021 src-tauri/src/services/subscription_wrapper.rs

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:subscriptions
      - run: pnpm check

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - run: rustfmt --edition 2021 --check src-tauri/src/services/subscription_wrapper.rs
      - run: cargo check --manifest-path src-tauri/Cargo.toml --locked --all-targets -j 1

      - name: Commit verified changes
        shell: bash
        run: |
          rm .github/workflows/patch-subscription-dialog-followup.yml
          rm .github/workflows/retry-subscription-dialog-followup.yml
          git config user.name "Kovawx"
          git config user.email "kovawx@gmail.com"
          git add -A
          git commit -m "fix(subscriptions): pin dialog chrome and honor custom UA"
          git push origin HEAD:agent/fix-subscription-format-detection
