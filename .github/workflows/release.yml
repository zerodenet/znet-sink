name: Release

on:
  push:
    tags:
      - 'v[0-9]+.*'

permissions:
  contents: write

jobs:
  # ── Generate changelog from conventional commits ──
  changelog:
    runs-on: ubuntu-latest
    outputs:
      body: ${{ steps.generate.outputs.body }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes from conventional commits
        id: generate
        shell: bash
        run: |
          # Find the previous tag so we only include commits from this release
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            RANGE=""  # first release — include all commits
          else
            RANGE="${PREV_TAG}..HEAD"
          fi

          # Categorize conventional commits.  Supports the common types from
          # commitlint-config-conventional.  Breaking changes are detected via
          # both "BREAKING CHANGE" footer and the "!:" shorthand (feat!: …).
          categorize() {
            local type="$1" label="$2"
            local commits
            # Match type: msg, type(scope): msg, and type!: msg (breaking)
            commits=$(git log --format="  - %s" ${RANGE} --grep="^${type}[!:(]" 2>/dev/null || true)
            if [ -n "$commits" ]; then
              echo "### ${label}"
              echo "$commits" | sed -E "s/^  - ${type}[!(]?:? ?/  - /; s/\)?:? / /"
              echo ""
            fi
          }

          # Breaking changes: "BREAKING CHANGE" footer or "type!:" prefix
          BREAKING=$(git log --format="  - %s" ${RANGE} --grep="BREAKING CHANGE\|!: " 2>/dev/null || true)

          {
            echo "## $(echo "${{ github.ref_name }}" | sed 's/^v//')"
            echo ""

            if [ -n "$BREAKING" ]; then
              echo "### ⚠ Breaking Changes"
              echo "$BREAKING"
              echo ""
            fi

            categorize "feat"     "🚀 Features"
            categorize "fix"      "🐛 Bug Fixes"
            categorize "perf"     "⚡ Performance"
            categorize "refactor" "🔧 Refactoring"
            categorize "docs"     "📝 Documentation"
            categorize "style"    "💄 Style"
            categorize "test"     "✅ Tests"
            categorize "ci"       "🤖 CI / Build"
            categorize "chore"    "🏠 Chores"
            categorize "revert"   "⏪ Reverts"
            categorize "build"    "📦 Dependencies"
          } > /tmp/release-notes.md

          # Fallback: if nothing matched, include a simple summary
          if [ $(wc -l < /tmp/release-notes.md) -le 3 ]; then
            echo "Full changelog: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${{ github.ref_name }}" >> /tmp/release-notes.md
          fi

          cat /tmp/release-notes.md

          # Write the body as a job output (multiline)
          {
            echo 'body<<EOF'
            cat /tmp/release-notes.md
            echo EOF
          } >> "$GITHUB_OUTPUT"

  # ── Build across platforms ──
  build:
    needs: changelog
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows: x86_64 only, NSIS exe + MSI
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform-key: windows-x86_64
          # macOS: build both Intel + Apple Silicon on macos-latest (ARM)
          - os: macos-latest
            target: aarch64-apple-darwin
            platform-key: darwin-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            platform-key: darwin-x86_64
          # Linux: x86_64, deb + AppImage
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform-key: linux-x86_64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify updater signing key is configured
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY secret is not set."
            echo "::error::Without it the updater cannot sign bundles, so no"
            echo "::error::latest.json is generated and the published manifest"
            echo "::error::becomes an invalid {\"platforms\":{}} that breaks"
            echo "::error::update checks for every installed client."
            echo "::error::"
            echo "::error::Generate a key pair and configure the secret:"
            echo "::error::  pnpm tauri signer generate -w ~/.tauri/znet-sink.key"
            echo "::error::Then add the private key to repo Settings > Secrets"
            echo "::error::> Actions as TAURI_SIGNING_PRIVATE_KEY."
            exit 1
          fi
        shell: bash

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Verify release version metadata
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          node scripts/version-manifests.mjs check "$TAG_VERSION"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tauri updater signing key — stored in GitHub Repository Secrets.
          # Generate via: pnpm tauri signer generate -w ~/.tauri/znet-sink.key
          # Then add the private key content to repo Settings > Secrets > TAURI_SIGNING_PRIVATE_KEY
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # tauri signer keys are scrypt-encrypted even when generated
          # "without password" (empty-password scrypt).  The bundler will
          # not auto-use the empty password — without this env var it
          # prompts interactively, which fails silently in CI and produces
          # no .sig / no latest.json.  The password is empty by design.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'v__VERSION__'
          releaseBody: ${{ needs.changelog.outputs.body }}
          # Keep the release hidden while matrix jobs merge their platform
          # entries into latest.json. A final job validates and publishes it.
          releaseDraft: true
          # Prerelease tags (vX.Y.Z-beta.N / -rc.N / -dev) publish as GitHub
          # prereleases so they do NOT become "latest" and push to every
          # updater client.  Stable tags (vX.Y.Z) stay regular releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
          # The app/updater keeps the full SemVer prerelease. Platform-native
          # numeric versions are synchronized separately by update_version,
          # so RC builds can produce MSI and signed macOS bundles as well.
          args: --target ${{ matrix.target }}

  # latest.json is generated and uploaded automatically by tauri-action's
  # uploadUpdaterJson (default enabled).  Across the matrix, each platform
  # job downloads the existing latest.json from the release, merges its own
  # platform entry, and re-uploads — so the final manifest carries every
  # platform.  Do NOT add a manual find/merge job: tauri build only emits
  # .sig files (not latest.json) to target/, and a manual merge would
  # overwrite tauri-action's correct output with an empty placeholder.

  publish:
    name: Validate and publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download updater manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern latest.json --output latest.json

      - name: Verify every updater platform is ready
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        shell: bash
        run: |
          EXPECTED_VERSION="${RELEASE_VERSION#v}"
          jq -e --arg version "$EXPECTED_VERSION" '
            .version == $version
            and (.platforms["windows-x86_64-nsis"].url | type == "string")
            and (.platforms["darwin-aarch64"].url | type == "string")
            and (.platforms["darwin-x86_64"].url | type == "string")
            and (.platforms["linux-x86_64"].url | type == "string")
          ' latest.json >/dev/null

      - name: Publish completed release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          args=(--draft=false)
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            args+=(--latest)
          fi
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" "${args[@]}"
