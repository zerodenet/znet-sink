name: Release

on:
  push:
    tags:
      - 'v[0-9]+.*'

permissions:
  contents: write

concurrency:
  group: znet-sink-release
  cancel-in-progress: false

jobs:
  policy:
    name: Validate release policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate managed tag and source branch
        shell: bash
        run: |
          TAG="$GITHUB_REF_NAME"
          VERSION="${TAG#v}"
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            EXPECTED_BRANCH=main
          elif [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]{12}$ ]]; then
            EXPECTED_BRANCH=main
          elif [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-dev\.[0-9]{12}$ ]]; then
            EXPECTED_BRANCH=develop
          else
            echo "::error::unsupported release tag $TAG; only dev, rc, and stable are allowed"
            exit 1
          fi

          git fetch origin "+refs/heads/${EXPECTED_BRANCH}:refs/remotes/origin/${EXPECTED_BRANCH}"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$EXPECTED_BRANCH"; then
            echo "::error::$TAG must originate from $EXPECTED_BRANCH"
            exit 1
          fi

          EXPECTED_COMMIT="chore(release): $VERSION"
          ACTUAL_COMMIT=$(git show -s --format=%s "$GITHUB_SHA")
          if [ "$ACTUAL_COMMIT" != "$EXPECTED_COMMIT" ]; then
            echo "::error::release tag must point to '$EXPECTED_COMMIT', found '$ACTUAL_COMMIT'"
            exit 1
          fi

  changelog:
    needs: policy
    runs-on: ubuntu-latest
    outputs:
      body: ${{ steps.generate.outputs.body }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate release notes from conventional commits
        id: generate
        shell: bash
        run: |
          mapfile -t TAGS < <(git tag --list)
          PREV_TAG=$(node scripts/release-policy.mjs previous "$GITHUB_REF_NAME" "${TAGS[@]}")
          if [ -z "$PREV_TAG" ]; then
            RANGE=""
          else
            RANGE="${PREV_TAG}..HEAD"
          fi

          categorize() {
            local type="$1" label="$2"
            local commits
            commits=$(git log --format="  - %s" ${RANGE} --grep="^${type}[!:(]" 2>/dev/null || true)
            if [ -n "$commits" ]; then
              echo "### ${label}"
              echo "$commits" | sed -E "s/^  - ${type}[!(]?:? ?/  - /; s/\)?:? / /"
              echo ""
            fi
          }

          BREAKING=$(git log --format="  - %s" ${RANGE} --grep="BREAKING CHANGE\|!: " 2>/dev/null || true)
          {
            echo "## ${GITHUB_REF_NAME#v}"
            echo ""
            if [ -n "$BREAKING" ]; then
              echo "### ⚠ Breaking Changes"
              echo "$BREAKING"
              echo ""
            fi
            categorize "feat"     "🚀 Features"
            categorize "fix"      "🐛 Bug Fixes"
            categorize "perf"     "⚡ Performance"
            categorize "refactor" "🔧 Refactoring"
            categorize "docs"     "📝 Documentation"
            categorize "style"    "💄 Style"
            categorize "test"     "✅ Tests"
            categorize "ci"       "🤖 CI / Build"
            categorize "chore"    "🏠 Chores"
            categorize "revert"   "⏪ Reverts"
            categorize "build"    "📦 Dependencies"
          } > /tmp/release-notes.md

          if [ $(wc -l < /tmp/release-notes.md) -le 3 ]; then
            if [ -n "$PREV_TAG" ]; then
              echo "Full changelog: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${GITHUB_REF_NAME}" >> /tmp/release-notes.md
            else
              echo "Initial release notes for ${GITHUB_REF_NAME}." >> /tmp/release-notes.md
            fi
          fi

          cat /tmp/release-notes.md
          {
            echo 'body<<EOF_NOTES'
            cat /tmp/release-notes.md
            echo EOF_NOTES
          } >> "$GITHUB_OUTPUT"

  build:
    needs: changelog
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform-key: windows-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            platform-key: darwin-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            platform-key: darwin-x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform-key: linux-x86_64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify updater signing key is configured
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY secret is not set."
            echo "::error::Without it the updater cannot sign bundles, so no"
            echo "::error::latest.json is generated and the published manifest"
            echo "::error::becomes an invalid {\"platforms\":{}} that breaks"
            echo "::error::update checks for every installed client."
            exit 1
          fi
        shell: bash

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Verify release version metadata
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          BUILD_NUMBER=$(git rev-list --count HEAD)
          node scripts/version-manifests.mjs check "$TAG_VERSION" "$BUILD_NUMBER"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'v__VERSION__'
          releaseBody: ${{ needs.changelog.outputs.body }}
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: --target ${{ matrix.target }}

  publish:
    name: Validate and publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download updater manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern latest.json --output latest.json

      - name: Verify every updater platform is ready
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        shell: bash
        run: |
          EXPECTED_VERSION="${RELEASE_VERSION#v}"
          jq -e --arg version "$EXPECTED_VERSION" '
            .version == $version
            and (.platforms["windows-x86_64-nsis"].url | type == "string")
            and (.platforms["darwin-aarch64"].url | type == "string")
            and (.platforms["darwin-x86_64"].url | type == "string")
            and (.platforms["linux-x86_64"].url | type == "string")
          ' latest.json >/dev/null

      - name: Publish completed release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          args=(--draft=false)
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            args+=(--latest)
          fi
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" "${args[@]}"

      - name: Cleanup promoted prereleases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          mapfile -t TAGS < <(git ls-remote --tags --refs origin | awk '{sub("refs/tags/", "", $2); print $2}')
          mapfile -t CLEANUP_TAGS < <(node scripts/release-policy.mjs cleanup "$GITHUB_REF_NAME" "${TAGS[@]}")
          if [ "${#CLEANUP_TAGS[@]}" -eq 0 ]; then
            echo "No prerelease cleanup required."
            exit 0
          fi

          for tag in "${CLEANUP_TAGS[@]}"; do
            if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::stable tag $tag was selected for cleanup; refusing"
              exit 1
            fi
            echo "Cleaning promoted prerelease $tag"
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes
            fi
            git push origin ":refs/tags/$tag"
          done
