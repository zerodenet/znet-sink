name: Patch subscription dialog follow-up

on:
  push:
    branches:
      - agent/fix-subscription-format-detection

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-subscription-format-detection
          fetch-depth: 0

      - name: Apply follow-up fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'src/lib/components/ui/dialog/dialog-content.svelte',
              '"grid max-h-[calc(100dvh-2rem)] max-w-[calc(100%-2rem)] gap-5 overflow-y-auto rounded-xl bg-popover p-6 text-sm text-popover-foreground ring-1 ring-foreground/10 shadow-2xl duration-100 sm:max-w-md data-open:animate-in data-open:fade-in-0 data-open:zoom-in-95 data-closed:animate-out data-closed:fade-out-0 data-closed:zoom-out-95 fixed top-1/2 left-1/2 z-50 w-full -translate-x-1/2 -translate-y-1/2 outline-none"',
              '"grid max-h-[calc(100dvh-2rem)] max-w-[calc(100%-2rem)] gap-0 overflow-hidden rounded-xl bg-popover p-0 text-sm text-popover-foreground ring-1 ring-foreground/10 shadow-2xl duration-100 sm:max-w-md data-open:animate-in data-open:fade-in-0 data-open:zoom-in-95 data-closed:animate-out data-closed:fade-out-0 data-closed:zoom-out-95 fixed top-1/2 left-1/2 z-50 w-full -translate-x-1/2 -translate-y-1/2 outline-none"',
          )
          replace_once(
              'src/lib/components/ui/dialog/dialog-content.svelte',
              'class="absolute top-4 right-4"',
              'class="absolute top-3 right-3 z-10"',
          )
          replace_once(
              'src/lib/components/ui/dialog/dialog-header.svelte',
              'class={cn("flex flex-col gap-2", className)}',
              'class={cn("flex shrink-0 flex-col gap-2 border-b border-border px-6 py-5 pr-14", className)}',
          )
          replace_once(
              'src/lib/components/ui/dialog/dialog-footer.svelte',
              'class={cn("flex flex-col-reverse gap-2 sm:flex-row sm:justify-end", className)}',
              'class={cn("flex shrink-0 flex-col-reverse gap-2 border-t border-border px-6 py-4 sm:flex-row sm:justify-end", className)}',
          )

          body = Path('src/lib/components/ui/dialog/dialog-body.svelte')
          body.write_text('''<script lang="ts">\n\timport { cn, type WithElementRef } from "$lib/utils.js";\n\timport type { HTMLAttributes } from "svelte/elements";\n\n\tlet {\n\t\tref = $bindable(null),\n\t\tclass: className,\n\t\tchildren,\n\t\t...restProps\n\t}: WithElementRef<HTMLAttributes<HTMLDivElement>> = $props();\n</script>\n\n<div\n\tbind:this={ref}\n\tdata-slot="dialog-body"\n\tclass={cn("min-h-0 overflow-y-auto px-6 py-5", className)}\n\t{...restProps}\n>\n\t{@render children?.()}\n</div>\n''', encoding='utf-8')

          replace_once(
              'src/lib/components/ui/dialog/index.ts',
              'import Close from "./dialog-close.svelte";\n',
              'import Body from "./dialog-body.svelte";\nimport Close from "./dialog-close.svelte";\n',
          )
          replace_once(
              'src/lib/components/ui/dialog/index.ts',
              'export {\n\tRoot,',
              'export {\n\tRoot,\n\tBody,',
          )
          replace_once(
              'src/lib/components/ui/dialog/index.ts',
              '\tRoot as Dialog,\n',
              '\tRoot as Dialog,\n\tBody as DialogBody,\n',
          )

          replace_once(
              'src/lib/components/tabs/SubscriptionsTab.svelte',
              '      <div class="form-fields">',
              '      <Dialog.Body class="form-fields">',
          )
          replace_once(
              'src/lib/components/tabs/SubscriptionsTab.svelte',
              '''        {#if formError}\n          <div class="form-error-box" role="alert">{formError}</div>\n        {/if}\n      </div>\n\n      <Dialog.Footer>''',
              '''        {#if formError}\n          <div class="form-error-box" role="alert">{formError}</div>\n        {/if}\n      </Dialog.Body>\n\n      <Dialog.Footer>''',
          )
          replace_once(
              'src/lib/components/tabs/SubscriptionsTab.svelte',
              '''    {#if deleteTarget}\n      <div class="form-error-box" role="alert">\n        确认删除“{deleteTarget.name}”吗？此操作无法从应用内撤销。\n      </div>\n    {/if}''',
              '''    <Dialog.Body>\n      {#if deleteTarget}\n        <div class="form-error-box" role="alert">\n          确认删除“{deleteTarget.name}”吗？此操作无法从应用内撤销。\n        </div>\n      {/if}\n    </Dialog.Body>''',
          )
          replace_once(
              'src/lib/components/tabs/SubscriptionsTab.svelte',
              'placeholder="自定义 UA 前缀（可选）"',
              'placeholder="自定义 User-Agent（可选）"',
          )
          replace_once(
              'src/lib/components/tabs/SubscriptionsTab.svelte',
              '留空时使用 ZNet-Sink/&lt;版本&gt;；填写后会在末尾自动追加 ZNet-Sink/&lt;版本&gt;。',
              '留空时使用 ZNet-Sink/&lt;版本&gt;；填写后完全覆盖默认 User-Agent。',
          )
          replace_once(
              'src/lib/components/tabs/SubscriptionsTab.svelte',
              '.subscription-form { display: grid; gap: 20px; }',
              '.subscription-form { display: grid; min-height: 0; max-height: calc(100dvh - 2rem); grid-template-rows: auto minmax(0, 1fr) auto; }',
          )

          wrapper = Path('src-tauri/src/services/subscription_wrapper.rs')
          text = wrapper.read_text(encoding='utf-8')
          old = '''fn contains_client_identity(value: &str) -> bool {\n    value.split_whitespace().any(|token| {\n        token\n            .to_ascii_lowercase()\n            .starts_with(CLIENT_USER_AGENT_PREFIX)\n    })\n}\n\nfn effective_user_agent(value: Option<&str>) -> String {\n    let value = value.unwrap_or_default().trim();\n    if value.is_empty() {\n        return CLIENT_USER_AGENT.to_string();\n    }\n    if contains_client_identity(value) {\n        return value.to_string();\n    }\n    format!("{value} {CLIENT_USER_AGENT}")\n}\n\nfn public_user_agent(value: Option<&str>) -> Option<String> {\n    let value = value.unwrap_or_default().trim();\n    if value.is_empty() {\n        return None;\n    }\n\n    let mut tokens = value.split_whitespace().collect::<Vec<_>>();\n    if tokens.last().is_some_and(|token| {\n        token\n            .to_ascii_lowercase()\n            .starts_with(CLIENT_USER_AGENT_PREFIX)\n    }) {\n        tokens.pop();\n    }\n\n    let prefix = tokens.join(" ");\n    if prefix.is_empty() {\n        None\n    } else {\n        Some(prefix)\n    }\n}\n'''
          new = '''fn is_default_user_agent(value: &str) -> bool {\n    let value = value.trim().to_ascii_lowercase();\n    value.split_whitespace().count() == 1 && value.starts_with(CLIENT_USER_AGENT_PREFIX)\n}\n\nfn strip_legacy_appended_client_identity(value: &str) -> String {\n    let mut tokens = value.split_whitespace().collect::<Vec<_>>();\n    if tokens.len() > 1\n        && tokens.last().is_some_and(|token| {\n            token\n                .to_ascii_lowercase()\n                .starts_with(CLIENT_USER_AGENT_PREFIX)\n        })\n    {\n        tokens.pop();\n    }\n    tokens.join(" ")\n}\n\nfn effective_user_agent(value: Option<&str>) -> String {\n    let value = value.unwrap_or_default().trim();\n    if value.is_empty() {\n        CLIENT_USER_AGENT.to_string()\n    } else {\n        value.to_string()\n    }\n}\n\nfn normalize_stored_user_agent(value: Option<&str>) -> String {\n    let value = value.unwrap_or_default().trim();\n    if value.is_empty() || is_default_user_agent(value) {\n        CLIENT_USER_AGENT.to_string()\n    } else {\n        strip_legacy_appended_client_identity(value)\n    }\n}\n\nfn public_user_agent(value: Option<&str>) -> Option<String> {\n    let value = value.unwrap_or_default().trim();\n    if value.is_empty() || is_default_user_agent(value) {\n        None\n    } else {\n        Some(strip_legacy_appended_client_identity(value))\n    }\n}\n'''
          if text.count(old) != 1:
              raise SystemExit('subscription_wrapper.rs: UA helper block mismatch')
          text = text.replace(old, new, 1)
          text = text.replace(
              'let next_user_agent = effective_user_agent(profile.user_agent.as_deref());',
              'let next_user_agent = normalize_stored_user_agent(profile.user_agent.as_deref());',
              1,
          )
          old_test = '''    #[test]\n    fn user_agent_always_contains_the_client_identity() {\n        assert_eq!(effective_user_agent(None), CLIENT_USER_AGENT);\n        assert_eq!(\n            effective_user_agent(Some("CustomClient/1.0")),\n            format!("CustomClient/1.0 {CLIENT_USER_AGENT}")\n        );\n        assert_eq!(\n            effective_user_agent(Some(CLIENT_USER_AGENT)),\n            CLIENT_USER_AGENT\n        );\n        assert_eq!(\n            effective_user_agent(Some("CustomClient/1.0 ZNet-Sink/0.0.1")),\n            "CustomClient/1.0 ZNet-Sink/0.0.1"\n        );\n        assert_eq!(public_user_agent(Some(CLIENT_USER_AGENT)), None);\n        assert_eq!(\n            public_user_agent(Some(&format!("CustomClient/1.0 {CLIENT_USER_AGENT}"))),\n            Some("CustomClient/1.0".to_string())\n        );\n        assert_eq!(\n            public_user_agent(Some("CustomClient/1.0 ZNet-Sink/0.0.1")),\n            Some("CustomClient/1.0".to_string())\n        );\n    }\n'''
          new_test = '''    #[test]\n    fn user_agent_defaults_when_blank_and_custom_values_override() {\n        assert_eq!(effective_user_agent(None), CLIENT_USER_AGENT);\n        assert_eq!(\n            effective_user_agent(Some("CustomClient/1.0")),\n            "CustomClient/1.0"\n        );\n        assert_eq!(public_user_agent(Some(CLIENT_USER_AGENT)), None);\n        assert_eq!(public_user_agent(Some("ZNet-Sink/0.0.1")), None);\n        assert_eq!(\n            normalize_stored_user_agent(Some("CustomClient/1.0 ZNet-Sink/0.0.1")),\n            "CustomClient/1.0"\n        );\n        assert_eq!(\n            public_user_agent(Some("CustomClient/1.0")),\n            Some("CustomClient/1.0".to_string())\n        );\n    }\n'''
          if text.count(old_test) != 1:
              raise SystemExit('subscription_wrapper.rs: UA test block mismatch')
          wrapper.write_text(text.replace(old_test, new_test, 1), encoding='utf-8')

          test = Path('scripts/test-subscription-contract.mjs')
          text = test.read_text(encoding='utf-8')
          text = text.replace("assert.match(wrapper, /contains_client_identity/);\n", "assert.match(wrapper, /fn effective_user_agent/);\n")
          text = text.replace(
              "assert.match(editor, /末尾自动追加 ZNet-Sink/);",
              "assert.match(editor, /填写后完全覆盖默认 User-Agent/);\nassert.match(editor, /<Dialog\\.Body class=\"form-fields\">/);",
          )
          text += "\nassert.doesNotMatch(wrapper, /format!\\(\"\\{value\\} \\{CLIENT_USER_AGENT\\}\"\\)/);\n"
          test.write_text(text, encoding='utf-8')
          PY

          cargo fmt --manifest-path src-tauri/Cargo.toml -- src/services/subscription_wrapper.rs

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:subscriptions
      - run: pnpm check

      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - run: rustfmt --edition 2021 --check src-tauri/src/services/subscription_wrapper.rs
      - run: cargo check --manifest-path src-tauri/Cargo.toml --locked --all-targets -j 1

      - name: Commit verified changes
        shell: bash
        run: |
          rm .github/workflows/patch-subscription-dialog-followup.yml
          git config user.name "Kovawx"
          git config user.email "kovawx@gmail.com"
          git add -A
          git commit -m "fix(subscriptions): pin dialog chrome and honor custom UA"
          git push origin HEAD:agent/fix-subscription-format-detection
