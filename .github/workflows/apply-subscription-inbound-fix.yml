name: Apply subscription inbound fix

on:
  push:
    branches:
      - agent/fix-native-subscription-mixed-inbound

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply source changes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          # Backend: prefer native Zero delivery unless Clash is explicitly selected.
          path = Path('src-tauri/src/services/subscription.rs')
          text = path.read_text()
          text = replace_once(
              text,
              'let format = normalize_optional(input.format).unwrap_or_else(|| "auto".to_string());',
              'let format = normalize_optional(input.format).unwrap_or_else(|| "zero-json".to_string());',
              'subscription default format',
          )
          text = replace_once(
              text,
              '''fn default_user_agent_for_format(format: &str) -> &'static str {
              match format.trim().to_ascii_lowercase().as_str() {
                  "" | "auto" | "clash" | "clash-yaml" | "yaml" | "clash-base64-yaml" | "base64-yaml" => {
                      DEFAULT_CLASH_USER_AGENT
                  }
                  _ => DEFAULT_USER_AGENT,
              }
          }
          ''',
              '''fn default_user_agent_for_format(format: &str) -> &'static str {
              match format.trim().to_ascii_lowercase().as_str() {
                  "clash" | "clash-yaml" | "yaml" | "clash-base64-yaml" | "base64-yaml" => {
                      DEFAULT_CLASH_USER_AGENT
                  }
                  _ => DEFAULT_USER_AGENT,
              }
          }
          ''',
              'subscription user agent policy',
          )
          text = replace_once(
              text,
              '''    if parsed.format.contains("clash") {
                  let (host, port) = {
                      let config = lock(state.app_config(), "app_config")?;
                      (config.local_proxy.host.clone(), config.local_proxy.port)
                  };
                  ensure_clash_local_inbound(
                      &mut parsed.content,
                      existing_profile
                          .as_ref()
                          .and_then(|profile| profile.content.as_ref()),
                      &host,
                      port,
                  )?;
              }
          ''',
              '''    let (host, port) = {
                  let config = lock(state.app_config(), "app_config")?;
                  (config.local_proxy.host.clone(), config.local_proxy.port)
              };
              ensure_subscription_local_inbound(
                  &mut parsed.content,
                  existing_profile
                      .as_ref()
                      .and_then(|profile| profile.content.as_ref()),
                  &host,
                  port,
              )?;
          ''',
              'subscription inbound application',
          )

          replacement = r'''fn ensure_subscription_local_inbound(
              content: &mut Value,
              existing_content: Option<&Value>,
              host: &str,
              port: u16,
          ) -> AppResult<()> {
              let object = content.as_object_mut().ok_or_else(|| {
                  AppError::invalid_argument("subscription must produce a JSON object")
              })?;
              if !object.contains_key("inbounds") {
                  object.insert("inbounds".to_string(), Value::Array(Vec::new()));
              }
              let inbounds = object
                  .get_mut("inbounds")
                  .and_then(Value::as_array_mut)
                  .ok_or_else(|| AppError::invalid_argument("subscription inbounds must be an array"))?;

              let mut incomplete_local_index = None;
              for (index, inbound) in inbounds.iter_mut().enumerate() {
                  if !is_local_proxy_inbound(inbound) {
                      continue;
                  }
                  if is_managed_local_inbound(inbound) {
                      set_local_inbound_endpoint(inbound, host, port)?;
                      return Ok(());
                  }
                  if local_inbound_is_usable(inbound) {
                      return Ok(());
                  }
                  incomplete_local_index.get_or_insert(index);
              }

              if let Some(index) = incomplete_local_index {
                  set_local_inbound_endpoint(&mut inbounds[index], host, port)?;
                  return Ok(());
              }

              if let Some(mut inbound) = existing_content
                  .and_then(|existing| existing.get("inbounds"))
                  .and_then(Value::as_array)
                  .and_then(|existing| {
                      existing
                          .iter()
                          .find(|inbound| is_local_proxy_inbound(inbound))
                          .cloned()
                  })
              {
                  if is_managed_local_inbound(&inbound) || !local_inbound_is_usable(&inbound) {
                      set_local_inbound_endpoint(&mut inbound, host, port)?;
                  }
                  inbounds.push(inbound);
                  return Ok(());
              }

              inbounds.push(json!({
                  "tag": "znet-sink-mixed-in",
                  "listen": { "address": host, "port": port },
                  "protocol": { "type": "mixed" }
              }));
              Ok(())
          }

          fn is_local_proxy_inbound(inbound: &Value) -> bool {
              inbound
                  .get("protocol")
                  .and_then(|protocol| protocol.get("type"))
                  .and_then(Value::as_str)
                  .is_some_and(|protocol| {
                      matches!(
                          protocol.trim().to_ascii_lowercase().as_str(),
                          "mixed" | "http" | "socks5"
                      )
                  })
          }

          fn is_managed_local_inbound(inbound: &Value) -> bool {
              inbound
                  .get("tag")
                  .and_then(Value::as_str)
                  .is_some_and(|tag| matches!(tag.trim(), "mixed-in" | "znet-sink-mixed-in"))
          }

          fn local_inbound_is_usable(inbound: &Value) -> bool {
              proxy_config::extract_local_proxy(&json!({ "inbounds": [inbound.clone()] })).is_some()
          }

          fn set_local_inbound_endpoint(inbound: &mut Value, host: &str, port: u16) -> AppResult<()> {
              let object = inbound.as_object_mut().ok_or_else(|| {
                  AppError::invalid_argument("subscription local inbound must be an object")
              })?;
              if object
                  .get("tag")
                  .and_then(Value::as_str)
                  .is_none_or(|tag| tag.trim().is_empty())
              {
                  object.insert(
                      "tag".to_string(),
                      Value::String("znet-sink-mixed-in".to_string()),
                  );
              }
              let listen = object
                  .entry("listen".to_string())
                  .or_insert_with(|| json!({}));
              let listen = listen.as_object_mut().ok_or_else(|| {
                  AppError::invalid_argument("subscription local inbound listen must be an object")
              })?;
              listen.insert("address".to_string(), Value::String(host.to_string()));
              listen.insert("port".to_string(), json!(port));
              Ok(())
          }

          '''
          text, count = re.subn(
              r'fn ensure_clash_local_inbound\(.*?\n\}\n\n(?=fn update_sync_success\()',
              replacement,
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'inbound helper: expected exactly one match, found {count}')

          text = text.replace('ensure_clash_local_inbound(', 'ensure_subscription_local_inbound(')
          text = replace_once(
              text,
              '''    fn clash_and_auto_fetches_request_the_full_clash_document() {
                  assert_eq!(default_user_agent_for_format("auto"), "Clash.Meta");
                  assert_eq!(default_user_agent_for_format("clash-yaml"), "Clash.Meta");
                  assert!(default_user_agent_for_format("zero-json").starts_with("ZNet-Sink/"));
              }
          ''',
              '''    fn automatic_and_zero_formats_request_the_native_zero_document() {
                  assert!(default_user_agent_for_format("auto").starts_with("ZNet-Sink/"));
                  assert!(default_user_agent_for_format("zero-json").starts_with("ZNet-Sink/"));
                  assert_eq!(default_user_agent_for_format("clash-yaml"), "Clash.Meta");
              }
          ''',
              'user agent test',
          )
          test_marker = '''    #[test]
              fn synced_proxy_config_uses_json_target_format_after_source_conversion() {
          '''
          tests = r'''    #[test]
          fn native_subscription_without_local_inbound_gets_mixed_inbound() {
              let mut content = json!({
                  "inbounds": [{
                      "tag": "tun-in",
                      "listen": { "address": "10.0.0.1", "port": 0 },
                      "protocol": { "type": "tun" }
                  }],
                  "outbounds": []
              });
              ensure_subscription_local_inbound(&mut content, None, "127.0.0.1", 7890).unwrap();

              assert_eq!(content["inbounds"].as_array().unwrap().len(), 2);
              let endpoint = proxy_config::extract_local_proxy(&content).unwrap();
              assert_eq!(endpoint.host, "127.0.0.1");
              assert_eq!(endpoint.port, 7890);
          }

          #[test]
          fn managed_legacy_mixed_inbound_uses_configured_endpoint() {
              let mut content = json!({
                  "inbounds": [{
                      "tag": "mixed-in",
                      "listen": { "address": "127.0.0.1", "port": 15581 },
                      "protocol": { "type": "mixed" }
                  }]
              });
              ensure_subscription_local_inbound(&mut content, None, "127.0.0.1", 7890).unwrap();

              let endpoint = proxy_config::extract_local_proxy(&content).unwrap();
              assert_eq!(endpoint.port, 7890);
          }

          #[test]
          fn incomplete_local_inbound_gets_configured_listen() {
              let mut content = json!({
                  "inbounds": [{
                      "tag": "custom-mixed",
                      "protocol": { "type": "mixed" }
                  }]
              });
              ensure_subscription_local_inbound(&mut content, None, "127.0.0.1", 8899).unwrap();

              let endpoint = proxy_config::extract_local_proxy(&content).unwrap();
              assert_eq!(endpoint.port, 8899);
          }

          '''
          text = replace_once(text, test_marker, tests + test_marker, 'inbound regression tests')
          path.write_text(text)

          # UI: make Zero JSON the explicit safe default.
          path = Path('src/lib/components/tabs/SubscriptionsTab.svelte')
          text = path.read_text()
          text = replace_once(
              text,
              '''  const FORMAT_OPTIONS = [
              { value: 'auto', label: '自动检测' },
              { value: 'zero-json', label: 'Zero JSON' },
          ''',
              '''  const FORMAT_OPTIONS = [
              { value: 'zero-json', label: 'Zero JSON（推荐）' },
              { value: 'auto', label: '自动检测（兼容）' },
          ''',
              'subscription format options',
          )
          text = replace_once(text, "      format: 'auto',", "      format: 'zero-json',", 'subscription form default')
          path.write_text(text)

          # Settings: expose the endpoint used for managed/fallback mixed inbounds.
          path = Path('src/lib/components/settings/AppConfigPanel.svelte')
          text = path.read_text()
          text = replace_once(
              text,
              "  let proxyBypassDraft = $state('');\n",
              "  let proxyHostDraft = $state('');\n  let proxyPortDraft = $state('7890');\n  let proxyBypassDraft = $state('');\n",
              'settings endpoint state',
          )
          text = replace_once(
              text,
              '''      config = next;
              proxyBypassDraft = (next.localProxy.bypass ?? DEFAULT_PROXY_BYPASS).join('\\n');
          ''',
              '''      config = next;
              proxyHostDraft = next.localProxy.host;
              proxyPortDraft = String(next.localProxy.port);
              proxyBypassDraft = (next.localProxy.bypass ?? DEFAULT_PROXY_BYPASS).join('\\n');
          ''',
              'settings endpoint load',
          )
          text = replace_once(
              text,
              '''  function parseProxyBypass(value: string): string[] {
          ''',
              '''  async function saveLocalProxyEndpoint() {
              if (!config) return;
              const host = proxyHostDraft.trim();
              const port = Number.parseInt(proxyPortDraft, 10);
              if (!host) {
                  updateError = 'Mixed 监听地址不能为空';
                  return;
              }
              if (!Number.isInteger(port) || port < 1 || port > 65535) {
                  updateError = 'Mixed 监听端口必须在 1 到 65535 之间';
                  return;
              }
              loading = true;
              updateError = null;
              try {
                  const updated = await updateAppConfig({ localProxy: { host, port } });
                  config = updated;
                  proxyHostDraft = updated.localProxy.host;
                  proxyPortDraft = String(updated.localProxy.port);
              } catch (error) {
                  updateError = getAppErrorMessage(error, '更新 Mixed 入站失败');
              } finally {
                  loading = false;
              }
          }

          function parseProxyBypass(value: string): string[] {
          ''',
              'settings endpoint save',
          )
          section = text.index('<div class="config-section-title">系统代理</div>')
          marker = '''    <div class="config-row">
              <div class="config-row-label">
                  <span class="label-text">关闭应用时自动清理代理</span>
          '''
          position = text.index(marker, section)
          markup = '''    <div class="proxy-endpoint-editor">
              <div class="config-row-label">
                  <span class="label-text">订阅缺省 Mixed 入站</span>
                  <span class="label-desc">订阅没有可用的 mixed、HTTP 或 SOCKS5 入站时自动补充。保存后重新同步订阅生效。</span>
              </div>
              <div class="proxy-endpoint-grid">
                  <label class="endpoint-field">
                      <span class="endpoint-label">监听地址</span>
                      <input
                          class="endpoint-input"
                          type="text"
                          bind:value={proxyHostDraft}
                          disabled={loading}
                          spellcheck="false"
                          aria-label="Mixed 监听地址"
                      />
                  </label>
                  <label class="endpoint-field">
                      <span class="endpoint-label">监听端口</span>
                      <input
                          class="endpoint-input"
                          type="number"
                          min="1"
                          max="65535"
                          bind:value={proxyPortDraft}
                          disabled={loading}
                          aria-label="Mixed 监听端口"
                      />
                  </label>
              </div>
              <div class="bypass-actions">
                  <button class="log-action-btn primary" onclick={saveLocalProxyEndpoint} disabled={loading}>保存</button>
              </div>
          </div>

          '''
          text = text[:position] + markup + text[position:]
          css = '''
          .proxy-endpoint-editor {
              display: grid;
              gap: 12px;
              margin-bottom: 14px;
              padding: 14px;
              border: 1px solid var(--border);
              border-radius: var(--radius);
              background: var(--muted);
          }

          .proxy-endpoint-grid {
              display: grid;
              grid-template-columns: minmax(0, 1fr) 160px;
              gap: 10px;
          }

          .endpoint-field {
              display: grid;
              gap: 6px;
          }

          .endpoint-label {
              color: var(--muted-foreground);
              font-size: 12px;
          }

          .endpoint-input {
              width: 100%;
              min-width: 0;
              height: var(--control-height);
              padding: 0 10px;
              color: var(--foreground);
              background: var(--background);
              border: 1px solid var(--border);
              border-radius: var(--radius);
              outline: none;
          }

          .endpoint-input:focus {
              border-color: var(--ring);
          }

          @media (max-width: 640px) {
              .proxy-endpoint-grid {
                  grid-template-columns: 1fr;
              }
          }
          '''
          if text.count('</style>') != 1:
              raise SystemExit('settings styles: expected exactly one </style>')
          text = text.replace('</style>', css + '\n</style>', 1)
          path.write_text(text)
          PY

      - name: Format and validate patch
        shell: bash
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml
          git diff --check

      - name: Commit generated fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-subscription-inbound-fix.yml
          git add src-tauri/src/services/subscription.rs \
                  src/lib/components/tabs/SubscriptionsTab.svelte \
                  src/lib/components/settings/AppConfigPanel.svelte
          git commit -m "fix(subscriptions): prefer native Zero and manage mixed inbound"
          git push
